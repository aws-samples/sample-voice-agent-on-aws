<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="400" fill="#fafafa" rx="12"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976d2"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#388e3c"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#000">Pipecat Voice Agent — Bidirectional Streaming with Nova Sonic</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#666">Pipecat pipeline + AWSNovaSonicLLMService over WebSocket</text>

  <!-- ===== BROWSER CLIENT ===== -->
  <rect x="30" y="75" width="180" height="140" rx="10" fill="white" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1976d2">🌐 Browser Client</text>

  <rect x="45" y="112" width="150" height="24" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#1565c0">@pipecat-ai/client-js</text>

  <rect x="45" y="142" width="150" height="24" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="120" y="158" text-anchor="middle" font-size="9" fill="#1565c0">WebSocketTransport</text>

  <rect x="45" y="172" width="150" height="24" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="120" y="188" text-anchor="middle" font-size="9" fill="#1565c0">ProtobufFrameSerializer</text>

  <!-- ===== PIPECAT SERVER ===== -->
  <rect x="290" y="65" width="350" height="250" rx="10" fill="white" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="465" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#388e3c">🤖 Pipecat Server (FastAPI + Pipeline)</text>

  <!-- Transport -->
  <rect x="310" y="105" width="140" height="30" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="380" y="124" text-anchor="middle" font-size="9" font-weight="600" fill="#2e7d32">WebSocket Transport</text>

  <!-- VAD -->
  <rect x="310" y="145" width="140" height="30" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="380" y="164" text-anchor="middle" font-size="9" font-weight="600" fill="#2e7d32">Silero VAD</text>

  <!-- Nova Sonic LLM -->
  <rect x="310" y="185" width="310" height="55" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="465" y="207" text-anchor="middle" font-size="10" font-weight="700" fill="#e65100">AWSNovaSonicLLMService</text>
  <text x="465" y="223" text-anchor="middle" font-size="9" fill="#bf360c">amazon.nova-2-sonic-v1:0 • Bidi stream • Built-in VAD</text>
  <text x="465" y="235" text-anchor="middle" font-size="8" fill="#666">16kHz in • 24kHz out • tiffany voice</text>

  <!-- Context Aggregators -->
  <rect x="310" y="250" width="140" height="30" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="380" y="269" text-anchor="middle" font-size="9" font-weight="600" fill="#2e7d32">Context Aggregators</text>

  <!-- Pipeline label -->
  <rect x="295" y="98" width="340" height="192" rx="8" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="640" y="200" font-size="9" font-weight="600" fill="#555" transform="rotate(90, 640, 200)">Pipeline</text>

  <!-- ===== TOOLS ===== -->
  <rect x="480" y="105" width="140" height="60" rx="6" fill="#fce4ec" stroke="#f48fb1"/>
  <text x="550" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#c2185b">🔧 Tools</text>
  <text x="550" y="142" text-anchor="middle" font-size="8" fill="#880e4f">get_current_time()</text>
  <text x="550" y="156" text-anchor="middle" font-size="8" fill="#888">Function calling</text>

  <!-- ===== BEDROCK ===== -->
  <rect x="700" y="170" width="170" height="70" rx="10" fill="white" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">☁️ Amazon Bedrock</text>
  <text x="785" y="216" text-anchor="middle" font-size="9" fill="#bf360c">Nova Sonic 2.0</text>
  <text x="785" y="230" text-anchor="middle" font-size="8" fill="#666">Bidi streaming API</text>

  <!-- ===== ARROWS ===== -->

  <!-- Browser → Server (WebSocket) -->
  <line x1="210" y1="140" x2="288" y2="140" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="288" y1="160" x2="210" y2="160" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="249" y="133" text-anchor="middle" font-size="8" fill="#1976d2">RTVI/Protobuf</text>
  <text x="249" y="175" text-anchor="middle" font-size="8" fill="#1976d2">WebSocket</text>

  <!-- Server → Bedrock -->
  <line x1="620" y1="210" x2="698" y2="210" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="659" y="203" text-anchor="middle" font-size="8" fill="#e65100">bidi stream</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="330" width="840" height="50" rx="8" fill="white" stroke="#ddd"/>
  <text x="50" y="352" font-size="9" font-weight="600" fill="#333">Flow:</text>
  <text x="50" y="368" font-size="8" fill="#555">Browser mic → Protobuf frames → WebSocket → Pipecat pipeline → Nova Sonic (bidi) → audio frames → WebSocket → Browser speaker</text>
  <text x="550" y="352" font-size="9" font-weight="600" fill="#333">Key:</text>
  <text x="550" y="368" font-size="8" fill="#555">No STT/TTS needed • Nova Sonic handles speech natively • Silero VAD for local turn detection • Tools via function calling</text>

</svg>

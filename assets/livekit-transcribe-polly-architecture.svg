<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12"/>

  <!-- Defs -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976d2"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#388e3c"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#000">LiveKit Voice Agent — Sandwich Architecture</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#666">Amazon Transcribe (STT) → Nova 2 Lite (LLM) → Amazon Polly (TTS) via LiveKit WebRTC</text>

  <!-- ===== BROWSER CLIENT ===== -->
  <rect x="30" y="100" width="180" height="130" rx="10" fill="white" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1976d2">🌐 Browser</text>
  <rect x="45" y="140" width="150" height="24" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="120" y="157" text-anchor="middle" font-size="9" fill="#1565c0">React + LiveKit SDK</text>
  <rect x="45" y="170" width="150" height="24" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="120" y="187" text-anchor="middle" font-size="9" fill="#1565c0">WebRTC (mic + speaker)</text>
  <rect x="45" y="200" width="150" height="24" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="120" y="217" text-anchor="middle" font-size="9" fill="#1565c0">Transcription display</text>

  <!-- ===== LIVEKIT SERVER ===== -->
  <rect x="280" y="100" width="180" height="130" rx="10" fill="white" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#7b1fa2">🔀 LiveKit Server</text>
  <rect x="295" y="140" width="150" height="24" rx="5" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="370" y="157" text-anchor="middle" font-size="9" fill="#6a1b9a">WebRTC SFU</text>
  <rect x="295" y="170" width="150" height="24" rx="5" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="370" y="187" text-anchor="middle" font-size="9" fill="#6a1b9a">Room + Agent Dispatch</text>
  <rect x="295" y="200" width="150" height="24" rx="5" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="370" y="217" text-anchor="middle" font-size="9" fill="#6a1b9a">Built-in VAD</text>

  <!-- ===== AGENT WORKER ===== -->
  <rect x="530" y="80" width="400" height="310" rx="10" fill="white" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#388e3c">🤖 Agent Worker (Python)</text>

  <!-- Pipeline stages -->
  <!-- STT -->
  <rect x="555" y="125" width="170" height="65" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="640" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">1. STT</text>
  <text x="640" y="165" text-anchor="middle" font-size="9" fill="#bf360c">Amazon Transcribe</text>
  <text x="640" y="180" text-anchor="middle" font-size="8" fill="#666">Streaming speech → text</text>

  <!-- LLM -->
  <rect x="555" y="205" width="170" height="65" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="640" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">2. LLM</text>
  <text x="640" y="245" text-anchor="middle" font-size="9" fill="#1b5e20">Nova 2 Lite (Bedrock)</text>
  <text x="640" y="260" text-anchor="middle" font-size="8" fill="#666">Reasoning + tool calls</text>

  <!-- TTS -->
  <rect x="555" y="285" width="170" height="65" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="640" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#1565c0">3. TTS</text>
  <text x="640" y="325" text-anchor="middle" font-size="9" fill="#0d47a1">Amazon Polly (Neural)</text>
  <text x="640" y="340" text-anchor="middle" font-size="8" fill="#666">Text → speech audio</text>

  <!-- Tools -->
  <rect x="760" y="195" width="150" height="85" rx="8" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="835" y="218" text-anchor="middle" font-size="10" font-weight="600" fill="#c2185b">🔧 Tools</text>
  <text x="835" y="238" text-anchor="middle" font-size="9" fill="#880e4f">@function_tool</text>
  <text x="835" y="255" text-anchor="middle" font-size="8" fill="#666">get_current_time()</text>
  <text x="835" y="270" text-anchor="middle" font-size="8" fill="#666">Custom functions</text>

  <!-- Pipeline arrows (vertical) -->
  <line x1="640" y1="190" x2="640" y2="203" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="270" x2="640" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM → Tools arrow -->
  <line x1="725" y1="237" x2="758" y2="237" stroke="#c2185b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- ===== CONNECTION ARROWS ===== -->

  <!-- Browser ↔ LiveKit Server -->
  <line x1="210" y1="155" x2="278" y2="155" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="278" y1="175" x2="210" y2="175" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="244" y="148" text-anchor="middle" font-size="8" fill="#1976d2">WebRTC</text>
  <text x="244" y="190" text-anchor="middle" font-size="8" fill="#1976d2">audio</text>

  <!-- LiveKit Server ↔ Agent Worker -->
  <line x1="460" y1="155" x2="528" y2="155" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="528" y1="175" x2="460" y2="175" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="494" y="148" text-anchor="middle" font-size="8" fill="#388e3c">Agent</text>
  <text x="494" y="190" text-anchor="middle" font-size="8" fill="#388e3c">Protocol</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="280" width="220" height="100" rx="8" fill="white" stroke="#ddd"/>
  <text x="45" y="300" font-size="10" font-weight="600" fill="#333">Pipeline Flow</text>
  <rect x="45" y="310" width="12" height="12" rx="2" fill="#fff3e0" stroke="#ffb74d"/>
  <text x="65" y="320" font-size="9" fill="#333">STT: Audio → Text (Transcribe)</text>
  <rect x="45" y="330" width="12" height="12" rx="2" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="65" y="340" font-size="9" fill="#333">LLM: Reasoning (Nova 2 Lite)</text>
  <rect x="45" y="350" width="12" height="12" rx="2" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="65" y="360" font-size="9" fill="#333">TTS: Text → Audio (Polly)</text>

</svg>

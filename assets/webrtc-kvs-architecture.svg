<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a6cf7"/>
    </marker>
    <marker id="arr-pink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7b1fa2"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00838f"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">WebRTC Voice Agent - KVS + Nova Sonic</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#888">WebRTC audio via KVS TURN/STUN, deployed on AgentCore Runtime with VPC</text>

  <!-- ===== BROWSER ===== -->
  <rect x="20" y="65" width="180" height="230" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="110" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Browser</text>

  <rect x="35" y="100" width="150" height="34" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="110" y="121" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">Microphone</text>

  <rect x="35" y="142" width="150" height="34" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="110" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">RTCPeerConnection</text>
  <text x="110" y="170" text-anchor="middle" font-size="8" fill="#888">sendrecv audio track</text>

  <rect x="35" y="184" width="150" height="34" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="110" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">Audio Playback</text>

  <rect x="35" y="226" width="150" height="28" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="110" y="244" text-anchor="middle" font-size="9" fill="#666">ICE candidate exchange</text>

  <!-- ===== VPC ===== -->
  <rect x="260" y="65" width="680" height="370" rx="12" fill="#fafcfa" stroke="#999" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="600" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Amazon VPC</text>

  <!-- Private Subnet -->
  <rect x="280" y="100" width="410" height="320" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <text x="485" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Private Subnet</text>
  <text x="485" y="134" text-anchor="middle" font-size="9" fill="#888">Route: 0.0.0.0/0 -&gt; NAT Gateway</text>

  <!-- AgentCore Runtime -->
  <rect x="300" y="148" width="370" height="255" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
  <text x="485" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">AgentCore Runtime</text>
  <text x="485" y="184" text-anchor="middle" font-size="9" fill="#888">Container (Python 3.12) - ENI with private IP</text>

  <!-- bot.py -->
  <rect x="318" y="198" width="160" height="52" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="398" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">bot.py (FastAPI)</text>
  <text x="398" y="230" text-anchor="middle" font-size="8" fill="#888">WebRTC offer/answer</text>
  <text x="398" y="242" text-anchor="middle" font-size="8" fill="#888">ICE handling</text>

  <!-- aiortc -->
  <rect x="318" y="260" width="160" height="38" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="398" y="277" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">aiortc</text>
  <text x="398" y="291" text-anchor="middle" font-size="8" fill="#888">RTCPeerConnection (server)</text>

  <!-- audio.py -->
  <rect x="318" y="308" width="160" height="38" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="398" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">audio.py</text>
  <text x="398" y="339" text-anchor="middle" font-size="8" fill="#888">48kHz-&gt;16kHz / OutputTrack</text>

  <!-- nova_sonic.py -->
  <rect x="498" y="198" width="155" height="78" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="575" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">nova_sonic.py</text>
  <text x="575" y="230" text-anchor="middle" font-size="8" fill="#888">Bidi stream to Bedrock</text>
  <text x="575" y="244" text-anchor="middle" font-size="8" fill="#888">16kHz PCM in</text>
  <text x="575" y="258" text-anchor="middle" font-size="8" fill="#888">24kHz PCM out</text>

  <!-- kvs.py -->
  <rect x="498" y="296" width="155" height="50" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="575" y="314" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">kvs.py</text>
  <text x="575" y="328" text-anchor="middle" font-size="8" fill="#888">Signaling channel init</text>
  <text x="575" y="340" text-anchor="middle" font-size="8" fill="#888">TURN/STUN credentials</text>

  <!-- Internal arrows -->
  <line x1="398" y1="250" x2="398" y2="258" stroke="#999" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="398" y1="298" x2="398" y2="306" stroke="#999" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="478" y1="327" x2="496" y2="260" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="496" y="298" font-size="7" fill="#999">PCM</text>

  <!-- ===== Public Subnet ===== -->
  <rect x="710" y="100" width="210" height="110" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <text x="815" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Public Subnet</text>
  <text x="815" y="134" text-anchor="middle" font-size="9" fill="#888">Route: 0.0.0.0/0 -&gt; IGW</text>

  <rect x="730" y="148" width="170" height="34" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="815" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">NAT Gateway</text>
  <text x="815" y="177" text-anchor="middle" font-size="8" fill="#888">Outbound internet egress</text>

  <!-- Internet Gateway -->
  <rect x="730" y="230" width="170" height="34" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="815" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">Internet Gateway</text>
  <text x="815" y="259" text-anchor="middle" font-size="8" fill="#888">Attached to VPC</text>

  <!-- Arrow: Private subnet -> NAT -->
  <line x1="690" y1="165" x2="728" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="709" y="158" text-anchor="middle" font-size="7" fill="#666">egress</text>

  <!-- Arrow: NAT -> IGW -->
  <line x1="815" y1="182" x2="815" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== AWS SERVICES ===== -->
  <rect x="260" y="455" width="680" height="120" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="600" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">AWS Services (via NAT / VPC Endpoints)</text>

  <rect x="370" y="492" width="190" height="48" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="465" y="511" text-anchor="middle" font-size="10" font-weight="bold" fill="#7b1fa2">Amazon Bedrock</text>
  <text x="465" y="525" text-anchor="middle" font-size="8" fill="#888">Nova Sonic (bidi stream)</text>
  <text x="465" y="536" text-anchor="middle" font-size="8" fill="#888">amazon.nova-2-sonic-v1:0</text>

  <rect x="585" y="492" width="190" height="48" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="680" y="511" text-anchor="middle" font-size="10" font-weight="bold" fill="#00838f">Kinesis Video Streams</text>
  <text x="680" y="525" text-anchor="middle" font-size="8" fill="#888">Signaling channel</text>
  <text x="680" y="536" text-anchor="middle" font-size="8" fill="#888">TURN / STUN servers</text>



  <!-- Arrow: nova_sonic -> Bedrock -->
  <line x1="575" y1="276" x2="465" y2="490" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="502" y="380" text-anchor="middle" font-size="8" font-weight="bold" fill="#7b1fa2">bidi stream</text>

  <!-- Arrow: kvs.py -> KVS -->
  <line x1="575" y1="346" x2="680" y2="490" stroke="#00838f" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="640" y="425" text-anchor="middle" font-size="8" font-weight="bold" fill="#00838f">TURN creds</text>



  <!-- ===== BROWSER -> AGENT ===== -->
  <line x1="200" y1="159" x2="260" y2="159" stroke="#4a6cf7" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="230" y="150" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a6cf7">WebRTC</text>
  <text x="230" y="174" text-anchor="middle" font-size="8" fill="#4a6cf7">audio (via TURN)</text>

  <line x1="298" y1="159" x2="316" y2="279" stroke="#4a6cf7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <line x1="200" y1="237" x2="260" y2="237" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-pink)"/>
  <text x="230" y="228" text-anchor="middle" font-size="8" fill="#c0392b">HTTP signaling</text>
  <text x="230" y="252" text-anchor="middle" font-size="8" fill="#c0392b">offer/answer/ICE</text>

  <line x1="298" y1="237" x2="316" y2="224" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-pink)"/>

  <!-- ===== LEGEND ===== -->
  <rect x="20" y="558" width="920" height="34" rx="6" fill="#fafafa" stroke="#ccc"/>

  <line x1="35" y1="575" x2="60" y2="575" stroke="#4a6cf7" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="65" y="579" font-size="9" fill="#555">WebRTC audio (TURN)</text>

  <line x1="195" y1="575" x2="220" y2="575" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-pink)"/>
  <text x="225" y="579" font-size="9" fill="#555">HTTP signaling</text>

  <line x1="330" y1="575" x2="355" y2="575" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="360" y="579" font-size="9" fill="#555">Bedrock bidi stream</text>

  <line x1="480" y1="575" x2="505" y2="575" stroke="#00838f" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="510" y="579" font-size="9" fill="#555">KVS signaling</text>

  <line x1="600" y1="575" x2="625" y2="575" stroke="#666" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="630" y="579" font-size="9" fill="#555">NAT egress</text>

  <rect x="720" y="568" width="14" height="14" rx="2" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="740" y="579" font-size="9" fill="#555">VPC boundary</text>



</svg>
